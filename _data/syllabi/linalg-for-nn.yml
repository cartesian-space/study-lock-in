          - label: "3B1B DL6 — Attention"
            url: "https://www.youtube.com/watch?v=eMlx5fFNoYc"
      - text: "Worksheet — scores as a Gram matrix. By hand, on paper: 3 tokens with embeddings X = [[1, 0], [0, 1], [1, 1]] (rows), and W_Q = W_K = I so Q = K = X. (1) S = QKᵀ. (2) Is S symmetric? Would it be with W_Q ≠ W_K? (3) Rank of S, and det S. Why must rank ≤ d_k? (4) Scale row 1 by 1/√2 and softmax it. ✔ Check: (1) [[1, 0, 1], [0, 1, 1], [1, 1, 2]]; (2) yes — but in general S = XW_QW_KᵀXᵀ is not symmetric: 'i attends to j' ≠ 'j attends to i'; (3) rank 2, det 0 — S = QKᵀ with Q of shape T×d_k, so rank ≤ d_k; (4) [0.707, 0, 0.707] → [0.401, 0.198, 0.401]"
        done: false
      - text: "Worksheet — rows of attention are averages. By hand, on paper: values V = [[1, 0], [0, 1], [2, 2]]. (1) Attention weights a = [0.5, 0.25, 0.25] for one query: output = Σⱼ aⱼvⱼ. (2) Explain why every output lies in the convex hull of the value vectors. (3) Every attention matrix A satisfies A1 = 1. What does that make 1, in eigen-terms? (4) What shape does A take with a causal mask, and what does row 1 contain? ✔ Check: (1) [1, 0.75]; (2) weights are ≥ 0 and sum to 1 — a convex combination can't leave the hull; (3) an eigenvector with eigenvalue 1; (4) lower-triangular; row 1 is [1, 0, 0] — token 1 sees only itself"
        done: false
      - text: "Worksheet — QK and OV circuits. By hand, on paper, with d_model = 512 and d_head = 64: (1) score(i, j) = xᵢᵀ(W_Q W_Kᵀ)xⱼ. What is the shape of W_Q W_Kᵀ, and its max rank? (2) Parameters in W_Q and W_K together vs a full d_model × d_model bilinear matrix. (3) The value-then-output path W_V W_O: shape and max rank? (4) Multi-head output = concat(heads)·W_O. Using block matrices, show it equals Σ_h head_h · W_O^(h), where W_O^(h) is head h's slice of rows. ✔ Check: (1) 512×512, rank ≤ 64; (2) 65,536 vs 262,144; (3) 512×512, rank ≤ 64; (4) [H₁ … H₈]·[W₁; …; W₈] = Σ H_hW_h — the column-times-row (outer-product) view, block by block"
        done: false
      - text: "Read: Anthropic — A Mathematical Framework for Transformer Circuits: 'The Residual Stream', 'Virtual Weights' and 'Attention Heads are Independent and Additive'."
        done: false
        resources:
          - label: "Transformer Circuits framework"
            url: "https://transformer-circuits.pub/2021/framework/index.html"
      - text: "Code (NumPy, 25 min): Implement single-head causal self-attention from scratch with shape asserts: X (T, d) → Q, K, V → scores/√d_k → mask → stable softmax → output. Check that rows of A sum to 1, that rank(QKᵀ) ≤ d_k, and that changing a future token never changes past outputs. Then add H heads and verify the concat·W_O = Σ per-head identity numerically."
        done: false
      - text: "Reflect (journal): The residual stream is a vector space every layer reads from (projections) and writes to (additions). Connect this to near-orthogonality in high dimensions (Matrix Norms section) and to low-rank heads (Rank section)."
        done: false
