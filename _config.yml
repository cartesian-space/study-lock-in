title: "Study Lock-In"
description: "Interactive study tracker with dynamic syllabus management, lock screen, and offline-first persistence"
url: "https://ovebepari.github.io"
baseurl: "/study-lock-in"

# Jekyll and GitHub Pages settings
markdown: kramdown
plugins:
  - jekyll-feed

# ── Lock screen ─────────────────────────────────────────────────────────
# Google sign-in (preferred): when google_client_id is set, the lock screen shows
# "Sign in with Google" and only the account whose lower-cased email hashes to
# allowed_email_sha256 may unlock. Client IDs are public by design (not a secret).
#   allowed_email_sha256 = SHA-256 of the lower-cased email — the address itself is not stored here.
google_client_id: ""
allowed_email_sha256: "b6fbd8fe4ff88e383a96285c61e37f6150d8c2acad204aa8dc61c1d522b5bf45"

# Passcode fallback (used only while google_client_id is empty): SHA-256 of the passcode.
# the passcode doesn't have to extreamly secure, this is just a simple guardrail
passcode_hash: "0a4e3dfca083d943032d0726daa1b5a1d063567d3082a7ff0165e1bced2aa088"

# Files to exclude from Jekyll generation
exclude:
  - scripts/
  - README.md
  - sync-to-github.sh
  - .gitignore
